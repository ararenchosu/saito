<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINES — Stake風</title>
<style>
:root {
  --bg-main: #0F1E33;
  --bg-secondary: #1A2C42;
  --bg-tertiary: #243A54;
  --bg-hover: #2C4463;
  --border: #2E4A6B;
  --accent-blue: #2563EB;
  --accent-green: #00D16F;
  --accent-gold: #F5B50A;
  --accent-red: #FF4D4F;
  --text-white: #FFFFFF;
  --text-gray: #94A3B8;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: var(--bg-main); color: var(--text-white); min-height: 100vh; }

.app-container { display: flex; min-height: 100vh; }
.side-icons { width: 56px; background: var(--bg-secondary); display: flex; flex-direction: column; align-items: center; padding: 1rem 0; gap: 1.5rem; border-right: 1px solid var(--border); }
.side-icon { font-size: 1.25rem; opacity: 0.6; cursor: pointer; transition: 0.2s; }
.side-icon:hover, .side-icon.active { opacity: 1; }

.main-area { flex: 1; padding: 1.5rem 2rem; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
.logo { font-size: 1.5rem; font-weight: 800; color: var(--text-white); text-decoration: none; }
.header-right { display: flex; align-items: center; gap: 1rem; }
.balance-box { background: var(--bg-secondary); padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border); font-weight: 600; }
.wallet-btn { background: var(--accent-blue); color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; }

.game-layout { display: flex; gap: 2rem; flex-wrap: wrap; }
.game-board { flex: 1; min-width: 360px; }
.game-title { font-size: 1.2rem; margin-bottom: 1rem; color: var(--text-gray); }
.multiplier { font-size: 2.5rem; font-weight: 800; color: var(--accent-green); margin-bottom: 1.5rem; font-family: 'SF Mono', monospace; }

.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 400px; }
.cell { aspect-ratio: 1; border: none; border-radius: 10px; background: var(--bg-tertiary); cursor: pointer; font-size: 1.5rem; transition: all 0.2s ease; }
.cell:hover:not(.opened) { background: var(--bg-hover); transform: scale(1.05); border: 1px solid var(--accent-gold); }
.cell.opened { cursor: default; }
.cell.diamond { background: linear-gradient(135deg, #00D16F, #00B85F); animation: pop 0.3s ease; }
.cell.bomb { background: linear-gradient(135deg, #FF4D4F, #D32F2F); animation: shake 0.4s ease; }
@keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

.control-panel { width: 320px; background: var(--bg-secondary); border-radius: 10px; border: 1px solid var(--border); padding: 1.5rem; }
.panel-label { font-size: 0.85rem; color: var(--text-gray); margin-bottom: 0.5rem; display: block; }
.panel-input { width: 100%; background: var(--bg-tertiary); border: 1px solid var(--border); color: white; padding: 0.8rem; border-radius: 6px; margin-bottom: 1rem; font-size: 1rem; }
.panel-input:focus { outline: none; border-color: var(--accent-blue); }
.btn { width: 100%; padding: 1rem; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 1rem; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent-gold); color: #000; margin-bottom: 0.75rem; }
.btn-primary:hover:not(:disabled) { background: #E5A609; transform: translateY(-2px); }
.btn-success { background: var(--accent-green); color: white; }
.btn-success:hover:not(:disabled) { background: #00B85F; transform: translateY(-2px); }

.status { margin-top: 1.5rem; padding: 1rem; background: var(--bg-tertiary); border-radius: 6px; min-height: 60px; }
.history { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.history-tag { padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
.history-win { background: rgba(0,209,111,0.15); color: var(--accent-green); }
.history-lose { background: rgba(255,77,79,0.15); color: var(--accent-red); }
</style>
</head>
<body>
<div class="app-container">
  <aside class="side-icons">
    <span class="side-icon" onclick="window.location.href='/'">🏠</span>
    <span class="side-icon active">💎</span>
    <span class="side-icon">📊</span>
  </aside>

  <main class="main-area">
    <div class="top-bar">
      <a href="/" class="logo">Stake</a>
      <div class="header-right">
        <div class="balance-box">💰 <span id="balance">0</span> PT</div>
        <button class="wallet-btn" onclick="window.location.href='/'">← ホーム</button>
      </div>
    </div>

    <div class="game-layout">
      <div class="game-board">
        <p class="game-title">MINES — 💎 ダイヤを探せ！</p>
        <div class="multiplier"><span id="mult">1.00</span>x</div>
        <div class="grid" id="grid"></div>
        <div class="status" id="status">爆弾数と賭け額を設定して開始してください</div>
        <div class="history" id="history"></div>
      </div>

      <div class="control-panel">
        <label class="panel-label">💣 爆弾数 (1～24)</label>
        <input type="number" id="bombs" class="panel-input" value="5" min="1" max="24">
        
        <label class="panel-label">💰 賭け額</label>
        <input type="text" id="bet" class="panel-input" placeholder="例: 100 / 1兆 / オールベット">
        
        <button class="btn btn-primary" id="startBtn" onclick="startGame()">🎮 ゲーム開始</button>
        <button class="btn btn-success" id="cashoutBtn" onclick="cashout()" disabled>💰 回収する</button>
      </div>
    </div>
  </main>
</div>

<script>
let gameActive = false;
let history = [];

async function updateBalance() {
  const res = await fetch("/api/balance", {method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
  const d = await res.json();
  document.getElementById("balance").textContent = Number(d.balance).toLocaleString();
}

async function startGame() {
  const bombs = parseInt(document.getElementById("bombs").value);
  const bet = document.getElementById("bet").value;
  const res = await fetch("/api/start", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({bombs,bet})
  });
  const d = await res.json();
  if (d.error) { alert(d.error); return; }
  gameActive = true;
  document.getElementById("mult").textContent = "1.00";
  document.getElementById("status").textContent = "💎 マスをクリックして開けてください";
  document.getElementById("cashoutBtn").disabled = false;
  document.getElementById("startBtn").disabled = true;
  renderGrid();
  updateBalance();
}

function renderGrid() {
  const g = document.getElementById("grid"); g.innerHTML = "";
  for(let i=0;i<25;i++){
    const b = document.createElement("button");
    b.className = "cell"; b.onclick = ()=>openCell(i); g.appendChild(b);
  }
}

async function openCell(idx) {
  if(!gameActive) return;
  const res = await fetch("/api/open", {
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({index:idx})
  });
  const d = await res.json();
  const cells = document.querySelectorAll(".cell");
  cells[idx].classList.add("opened");

  if(d.result === "lose"){
    gameActive = false;
    d.bombs.forEach(i=>{cells[i].classList.add("bomb"); cells[i].textContent="💣";});
    addHistory(false);
    document.getElementById("status").innerHTML = "<span style='color:var(--accent-red)'>💥 爆弾！負けました</span>";
    document.getElementById("cashoutBtn").disabled = true;
    document.getElementById("startBtn").disabled = false;
    updateBalance();
  } else {
    cells[idx].classList.add("diamond"); cells[idx].textContent="💎";
    document.getElementById("mult").textContent = d.multiplier;
    if(d.result === "win"){
      gameActive = false; addHistory(true, d.multiplier);
      document.getElementById("status").innerHTML = `<span style='color:var(--accent-green)'>🎉 大当たり！${Number(d.amount).toLocaleString()} PT</span>`;
      document.getElementById("cashoutBtn").disabled = true;
      document.getElementById("startBtn").disabled = false;
      updateBalance();
    }
  }
}

async function cashout() {
  if(!gameActive) return;
  const res = await fetch("/api/cashout", {method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
  const d = await res.json();
  gameActive = false; addHistory(true, d.multiplier);
  document.getElementById("status").innerHTML = `<span style='color:var(--accent-green)'>💰 回収成功！${Number(d.amount).toLocaleString()} PT</span>`;
  document.getElementById("cashoutBtn").disabled = true;
  document.getElementById("startBtn").disabled = false;
  updateBalance();
}

function addHistory(win, mult=0){
  history.unshift({win,mult}); if(history.length>8) history.pop();
  document.getElementById("history").innerHTML = history.map(h=>
    `<span class="history-tag ${h.win?'history-win':'history-lose'}">${h.win?`✓ ${h.mult}x`:'✗'}</span>`
  ).join("");
}

updateBalance();
</script>
</body>
</html>
