<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💎 ほんさば マインス</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
body { background: #1a1a2e; color: #fff; min-height: 100vh; }
header { padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); }
.logo { font-size: 1.4rem; font-weight: bold; color: #FFD700; }
nav a { color: #ccc; text-decoration: none; margin-left: 1rem; }
nav a:hover { color: #FFD700; }
main { max-width: 800px; margin: 3rem auto; padding: 0 1rem; text-align: center; }
h1 { font-size: 2.5rem; margin-bottom: 1rem; color: #FFD700; }
.btn { display: inline-block; padding: 0.8rem 2rem; background: #2ecc71; color: #fff; border-radius: 8px; text-decoration: none; font-weight: bold; margin: 0.5rem; }
.btn:hover { background: #27ae60; }
.btn-discord { background: #5865F2; }
.btn-discord:hover { background: #4752C4; }
</style>
</head>
<body>
<header>
  <div class="logo">💎 ほんさば</div>
  <nav>
    <a href="/">ホーム</a>
    <a href="/ranking">ランキング</a>
    {% if user_id %}
      <a href="/mines">マインス</a>
      <a href="/profile">マイページ</a>
      <a href="/logout">ログアウト</a>
    {% else %}
      <a href="/login" class="btn-discord">Discordでログイン</a>
    {% endif %}
  </nav>
</header>
<main>
  <h1>💎 マインスゲーム</h1>
  <p style="font-size: 1.2rem; margin-bottom: 2rem; color: #aaa;">
    ダイヤを開いて億万長者を目指そう！<br>
    最大 1垓 倍 の超高配当✨
  </p>
  {% if user_id %}
    <a href="/mines" class="btn">🎮 ゲームをプレイ</a>
  {% else %}
    <a href="/login" class="btn btn-discord">🔐 Discordでログインしてプレイ</a>
  {% endif %}
  <br><br>
  <a href="/ranking" class="btn" style="background: #3498db;">📊 ランキングを見る</a>
</main>
</body>
</html>
